name: MeshVault CI

on:
  push:
    branches: [main, "arena/**", "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: never

jobs:
  rust-fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          if ! cargo fmt --all -- --check > fmt.log 2>&1; then
            cat fmt.log
            python3 -c "import pathlib; txt = pathlib.Path(\"fmt.log\").read_text()[:3000].replace(\"%\",\"%25\").replace(\"\\r\",\"%0D\").replace(\"\\n\",\"%0A\"); print(f\"::error::{txt}\")"
            exit 1
          fi

  rust-core:
    name: Rust Clippy and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles("Cargo.toml", "crates/*/Cargo.toml") }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: |
          if ! cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1; then
            cat clippy.log
            python3 -c "import pathlib; txt = pathlib.Path(\"clippy.log\").read_text()[-3000:].replace(\"%\",\"%25\").replace(\"\\r\",\"%0D\").replace(\"\\n\",\"%0A\"); print(f\"::error::{txt}\")"
            exit 1
          fi

      - name: Run unit and integration tests
        run: |
          if ! cargo test --workspace --verbose > test.log 2>&1; then
            cat test.log
            python3 -c "import pathlib; txt = pathlib.Path(\"test.log\").read_text()[-3000:].replace(\"%\",\"%25\").replace(\"\\r\",\"%0D\").replace(\"\\n\",\"%0A\"); print(f\"::error::{txt}\")"
            exit 1
          fi

      - name: Check CLI build
        run: cargo build --bin meshvault

  android-app:
    name: Android Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK and run JVM unit tests
        run: |
          if ! gradle -p apps/android --no-daemon testDebugUnitTest assembleDebug > android.log 2>&1; then
            cat android.log
            python3 -c "import pathlib; txt = pathlib.Path(\"android.log\").read_text()[-3500:].replace(\"%\",\"%25\").replace(\"\\r\",\"%0D\").replace(\"\\n\",\"%0A\"); print(f\"::error::{txt}\")"
            exit 1
          fi
