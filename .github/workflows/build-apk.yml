name: Build Debug APK

on:
  push:
    branches:
      - arena/82306ed8-meshvault
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble :app:assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (platform 35)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnose dependency resolution
        run: |
          ./gradlew -q --console=plain :ui:dependencyInsight --dependency material-icons --configuration debugCompileClasspath > insight.log 2>&1 || true
          ./gradlew -q --console=plain :ui:dependencies --configuration debugCompileClasspath > deps.log 2>&1 || true
          grep -i "icons" deps.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"; line="${line:0:300}"; [ -n "$line" ] && echo "::warning::icons-in-tree: $line"
          done | head -20

      - name: Assemble debug APK (with diagnostic log)
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > build.log 2>&1
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            echo "BUILD SUCCESSFUL"
            tail -n 5 build.log
            exit 0
          fi
          echo "Gradle exited with code $CODE — emitting failure diagnostics as annotations"

          emit_error() {
            local line="$1"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/''}"
            line="${line:0:500}"
            echo "::error::$line"
          }

          echo "--- tail (80 lines) ---"
          tail -n 80 build.log
          echo "::warning::total compiler error lines: $(grep -c '^e: ' build.log)"
          grep -E "^e: " build.log | sed -E 's/^e: ([^:]+):.*Unresolved reference/  -> \1/' | awk '{print $2}' | sort | uniq -c | sort -rn | head -10 | while IFS= read -r line; do echo "::warning::unresolved per file:$line"; done

          # Unique unresolved references, compacted into one annotation
          UNIQUE=$(grep -oE "Unresolved reference '[^']+'" build.log | sed "s/Unresolved reference //" | sort | uniq -c | sort -rn | awk '{printf "%s×%s  ", $2, $1}')
          echo "::warning::unique unresolved symbols: ${UNIQUE:-none}"
          # Non-icon / non-'Unresolved reference' compiler errors individually
          grep -E "^e: " build.log | grep -v "Unresolved reference" | head -15 | while IFS= read -r line; do emit_error "$line"; done
          # First 8 raw error lines for file/line context
          grep -E "^e: " build.log | head -8 | while IFS= read -r line; do emit_error "$line"; done
          # Java compiler errors
          grep -E "error:" build.log | grep -v "^e: " | head -20 | while IFS= read -r line; do emit_error "$line"; done
          # Gradle FAILURE block with cause
          grep -E -A8 "^FAILURE:" build.log | head -40 | while IFS= read -r line; do emit_error "$line"; done
          # 'What went wrong' section
          grep -E -A6 "What went wrong:" build.log | head -30 | while IFS= read -r line; do emit_error "$line"; done
          # Dependency resolution problems
          grep -E "Could not (resolve|find|download|determine)" build.log | head -20 | while IFS= read -r line; do emit_error "$line"; done
          exit "$CODE"

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            insight.log
            deps.log
            build.log
          retention-days: 3

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshvault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
