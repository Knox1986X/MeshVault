[workspace]
resolver = "2"
members = [
    "crates/meshvault-crypto",
    "crates/meshvault-storage",
    "crates/meshvault-import",
    "crates/meshvault-sync",
    "crates/meshvault-ffi",
    "crates/meshvault-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Knox1986X/MeshVault"
rust-version = "1.80"

[workspace.dependencies]
argon2 = "0.5.3"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.1", features = ["derive"] }
